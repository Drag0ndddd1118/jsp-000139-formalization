name: Lean Build and Axiom Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Cache mathlib
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages/mathlib/.lake/build
          key: ${{ runner.os }}-mathlib-${{ hashFiles('lakefile.lean', 'lean-toolchain') }}
      - name: Lake update
        run: lake update
      - name: Lake exe cache get
        run: lake exe cache get
      - name: Lake build
        run: lake build
      - name: Lean verify JSP
        run: lake env lean JSP_000139.lean
